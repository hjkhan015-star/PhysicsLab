<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14"><meta name="description" content="Interactive 3D physics lab for SEBA Class 8, 9 and 10.">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Physics Lab">
<title>Physics Lab</title><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32"><link rel="icon" href="icons/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css"></head>
<body class="home">
<div class="top"><div class="brand" id="brand"></div><div><h1>Physics Lab</h1><p>SEBA Class 8 · 9 · 10 — touch it, change it, see the physics.</p></div><span class="spacer"></span><button id="theme">◐ Theme</button></div>
<div class="tabs" id="tabs"></div><div class="lvhead" id="lvhead"></div><div id="grid"></div>
<p class="foot">Chapter numbers follow the SEBA General Science textbooks.</p>
<script type="module">
import { CLASSES, levelIcon } from './syllabus.js';
const $ = id => document.getElementById(id), root = document.documentElement;
const get = (k, d) => { try { return localStorage.getItem('pl.' + k) ?? d; } catch (e) { return d; } }, set = (k, v) => { try { localStorage.setItem('pl.' + k, v); } catch (e) {} };
root.dataset.theme = JSON.parse(get('theme', '"dark"')); $('brand').innerHTML = levelIcon(3);
$('theme').onclick = () => { root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light'; set('theme', JSON.stringify(root.dataset.theme)); };
const q = +new URLSearchParams(location.search).get('c'); let cur = Math.max(0, CLASSES.findIndex(c => c.n === (q || +get('class', 8))));
function draw() {
  const L = CLASSES[cur], ready = L.modules.filter(m => !m.soon).length;
  $('tabs').innerHTML = CLASSES.map((c, i) => `<button class="tab ${i === cur ? 'on' : ''}" style="--c:${c.color};${i === cur ? 'background:' + c.color : ''}" data-i="${i}" aria-label="Class ${c.n}"><b>${c.n}</b><small>Class</small></button>`).join('');
  $('lvhead').innerHTML = `<div class="ic" style="color:${L.color}">${levelIcon(L.icon)}</div><div><em style="background:${L.color}">${L.tag}</em><p>${L.blurb}</p><small>${ready} of ${L.modules.length} simulations ready</small></div>`;
  $('grid').innerHTML = L.modules.map(m => {
    const inner = `<div class="mi" style="background:${m.color}22;color:${m.color}"><svg viewBox="0 0 24 24">${m.icon}</svg></div><b>${m.label}</b>${L.n === 8 && !m.soon ? '' : `<span>${L.n === 8 ? '' : m.sub}</span>`}${m.ch ? `<i class="ch">Ch ${m.ch}</i>` : ''}`;
    return m.soon ? `<div class="card soon">${inner}</div>` : `<a class="card ${m.bonus ? 'bonus' : ''}" href="lab.html?sim=${m.id}">${inner}</a>`; }).join('');
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { cur = +b.dataset.i; set('class', CLASSES[cur].n); draw(); });
}
draw();
// offline: register the service worker, then quietly fetch every ready simulation so the whole lab works without internet
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => {
  fetch('lab.html'); CLASSES.forEach(c => c.modules.filter(m => !m.soon).forEach(m => fetch(`sims/${m.id}.js`))); }).catch(() => {});
</script></body></html>
